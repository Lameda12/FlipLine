[package]
name = "flipline"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
log = "0.4.34"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
env_logger = "0.11.11"
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage", "Node", "HtmlCanvasElement", "Event", "EventTarget", "PointerEvent", "MouseEvent", "AddEventListenerOptions"] }
